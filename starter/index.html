<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <title>DOM PROJECT</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header-section">
      <div class="header">
        <nav>
          <span>Model</span>
          <button class="btn btn-small">Sign In</button>
        </nav>
      </div>
    </header>
    <div class="overlay hidden"></div>
    <section class="hero-section">
      <div class="hero">
        <div class="hero-grid">
          <div class="hero-image">
            <img src="src/About-img.png" alt="Hero Image" class="" />
          </div>
          <div class="hero-content">
            <h1>Practice on how DOM manipulation work</h1>
            <p class="">
              This project will give you a great insight on how to work with
              classes, select classes, and use classes to manipulate DOM, You
              will understand how to target multiple element with same class
              names, which will give you a Node List.
            </p>
            <button class="btn btn-big">Sign In</button>
          </div>
        </div>
      </div>
    </section>
    <div class="modal hidden">
      <span class="times">&times;</span>
      <p class="modal-text">Sign In successful</p>
    </div>
  </body>
</html>
